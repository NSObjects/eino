name: Eino Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DEFAULT_GO_VERSION: "1.25.6"

jobs:
  unit-test:
    name: eino-unit-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      COVERAGE_FILE: coverage.out
      BREAKDOWN_FILE: main.breakdown
      
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.DEFAULT_GO_VERSION }}
          
      - name: Exec Go Test
        run: |
          modules=`find . -name "go.mod" -exec dirname {} \;`
          echo $modules
          list=""
          coverpkg=""
          if [[ ! -f "go.work" ]];then go work init;fi
          for module in $modules; do go work use $module; list=$module"/... "$list; coverpkg=$module"/...,"$coverpkg; done
          go work sync
          go test -race -v -coverprofile=${{ env.COVERAGE_FILE }} -gcflags="all=-l -N" -coverpkg=$coverpkg $list
          
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: eino-coverage
          path: coverage.out

  benchmark-test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.DEFAULT_GO_VERSION }}

      - name: Run Benchmark Tests
        run: go test -bench=. -benchmem -run=none ./...

  compatibility-test:
    strategy:
      matrix:
        go: [ "1.19", "1.20", "1.21", "1.22", "1.23", "1.24" ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Compatibility Test
        run: |
          # just basic unit test, no coverage report
          go test -race ./...

  api-compatibility:
    name: api-compatibility-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # go-apidiff v0.8.2 depends on x/tools v0.17.0, which requires the older toolchain.
          go-version: "1.22"
          
      - name: Install go-apidiff
        run: go install github.com/joelanford/go-apidiff@v0.8.2
          
      - name: Check API compatibility
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Compare tracked source snapshots in a clean repository. The historical
          # examples/ext gitlinks have no .gitmodules entries and go-git treats
          # them as deleted, even in a fresh checkout.
          source_repo="$PWD"
          compare_repo=$(mktemp -d)
          report=$(mktemp)
          trap 'rm -rf "$compare_repo" "$report"' EXIT
          git -C "$compare_repo" init -q
          git -C "$compare_repo" config user.name 'API compatibility CI'
          git -C "$compare_repo" config user.email 'ci@example.invalid'
          snapshot() {
            git -C "$source_repo" archive "$1" | tar -xf - -C "$compare_repo"
            git -C "$compare_repo" add -f .
            git -C "$compare_repo" commit --allow-empty -qm "Snapshot $1"
            git -C "$compare_repo" rev-parse HEAD
          }
          old_commit=$(snapshot "$BASE_SHA")
          git -C "$compare_repo" rm -qr -- .
          new_commit=$(snapshot "$HEAD_SHA")
          status=0
          (cd "$compare_repo" && go-apidiff "$old_commit" "$new_commit") > "$report" 2>&1 || status=$?
          cat "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
